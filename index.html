}

/* ---------- 1問ずつ解く画面 ---------- */
function render(){
  const q=$('#q'); const c=S.cur;
  if(!c){q.innerHTML=`<div class="empty">${S.mode==='order'&&(S.omode==='strict'||S.omode==='genre'||S.omode==='bank')?'この出し方では、この時代とテーマの組み合わせの問題が作れません。テーマを「おまかせ」にするか、出し方を変えてください。':'この時代とテーマの組み合わせでは問題が作れません。時代を増やすか、テーマを変えてください。'}</div>`;return;}
  if(c.type==='order'){ c.imp=orderImportance(c.items); if(S.flash2){ setTimeout(()=>{S.flash2='';},0); } q.innerHTML=`<div class="qhead"><span class="qno">第${S.qno}問</span><span class="tag">${esc(c.theme)}</span><span class="imp imp${c.imp.level}">順番：${IMP_LABEL[c.imp.level]}</span></div>`+(S.flash2?`<p class="warn">${esc(S.flash2)}</p>`:'')+renderOrder(c); }
  if(c.type==='fill') q.innerHTML=`<div class="qhead"><span class="qno">第${S.qno}問</span><span class="tag">${esc(c.theme)}</span></div>`+renderFill(c);
  if(c.type==='exam') q.innerHTML=`<div class="qhead"><span class="qno">第${S.qno}問</span><span class="tag">${esc(c.theme)}</span></div>`+renderExam(c);
  if(c.type==='essay') q.innerHTML=`<div class="qhead"><span class="qno">第${S.qno}問</span><span class="era" style="--c:var(${ERA_COLOR[c.q.era]})">${c.q.era}</span></div>`+renderEssay(c);
  const f=q.querySelector('input,textarea'); if(f&&!S.answered) f.focus({preventScroll:true});
}
const correctOrder=items=>items.map((e,i)=>i).sort((a,b)=>items[a].y-items[b].y||a-b);
// 同じ年のできごとは、どちらが先でも正解
const orderOk=c=>c.picked.every((p,k)=>k===0||c.items[c.picked[k-1]].y<=c.items[p].y);

function renderOrder(c){
  const n=c.items.length; const correct=correctOrder(c.items);
  const tie=distinctYears(c.items)<n;
  let h=`<p class="prompt">次の${KANA[0]}〜${KANA[n-1]}のできごとを、年代の古い順に並べなさい。${tie?'<span class="note">（同じ年のできごとは、どちらが先でも正解）</span>':''}</p>`;
  h+=`<div class="slots" style="--n:${n}">`+Array.from({length:n},(_,k)=>{
    const p=c.picked[k]; let cls='slot';
    if(p!==undefined){cls+=' filled'; if(S.answered) cls+= c.items[p].y===c.items[correct[k]].y?' ok':' ng';}
    return `<button class="${cls}" data-slot="${k}" ${S.answered||p===undefined?'disabled':''} aria-label="${k+1}番目">${k===0?'<span class="ord">古</span>':k===n-1?'<span class="ord">新</span>':''}${p!==undefined?KANA[p]:''}</button>`;
  }).join('')+`</div>`;
  h+=`<ul class="cards">`+c.items.map((e,i)=>{
    const used=c.picked.includes(i);
    return `<li><button class="card${used?' used':''}" data-pick="${i}" ${used||S.answered?'disabled':''}><span class="kana">${KANA[i]}</span><span>${filled(e)}</span></button></li>`;
  }).join('')+`</ul>`;
  if(!S.answered){
    h+=`<div class="actions">${c.custom?'':'<button class="btn danger" data-act="bancur">この並び替えを削除（今後出さない）</button>'}${c.custom?'<button class="btn" data-act="tolist">一覧にもどる</button>':''}<button class="btn" data-act="reset" ${c.picked.length?'':'disabled'}>やり直す</button><button class="btn primary" data-act="judge" ${c.picked.length===n?'':'disabled'}>判定する</button></div>`;
  }else{
    const ok=orderOk(c);
    const sorted=correct.map(i=>({e:c.items[i],i}));
    h+=`<div class="result ${ok?'ok':'ng'}"><div class="verdict">${ok?'正解':'不正解'}<small>正しい順：${correct.map(i=>KANA[i]).join(' → ')}</small></div>
      ${timeline(sorted)}
      ${flowHTML(sorted.map(x=>x.e),sorted.map(x=>KANA[x.i]),c.tk,c.gx,c.bi)}
    </div><div class="actions">${c.custom?'':'<button class="btn danger" data-act="bancur">この並び替えを削除（今後出さない）</button>'}${c.custom?'<button class="btn" data-act="retry">同じ組み合わせでもう一度</button><button class="btn" data-act="tolist">一覧にもどる</button>':''}<button class="btn next" data-act="next">次の問題</button></div>`;
  }
  return h;
}

function bankExp(bi){ const r=BANK[bi]; return `<div class="bexp"><p class="flow-sum"><span class="fs-l">まとめ</span><b class="bti">${esc(r.ti)}</b>${esc(r.sum)}</p><p class="flow-sum btip"><span class="fs-l tipl">覚え方</span>${esc(r.tip)}</p></div>`; }
function flowHTML(evs,labels,tk,gx,bi){
  const steps=flowSteps(evs,tk,gx,bi);
  let h='<div class="flow">';
  if(bi!=null&&BANK[bi]) h+=bankExp(bi);
  else if(tk&&FLOW[tk]) h+=`<p class="flow-sum"><span class="fs-l">流れ</span>${esc(FLOW[tk])}</p>`;
  evs.forEach((e,k)=>{
    h+=`<div class="fl-item"><span class="kana">${labels[k]}</span><span class="y">${yv(e)}${yu(e)}</span><span>${eraTag(e)}${rankCtl(e)} ${filled(e)}</span></div>`;
    if(k<steps.length){ const s=steps[k]; const nx=evs[k+1]; const bk=pairKey(e,nx); const ob=obviousPair(e,nx);
      h+=`<div class="fl-step ${s.kind}"><span class="ar" aria-hidden="true"></span><span>${s.kind==='cause'?'<span class="why-l">つながり</span>':s.kind==='genre'?'<span class="why-l gen">同じ分野</span>':''}${canonPair(e,nx)?`<span class="canon-l">定番：${esc(canonPair(e,nx))}</span>`:''}${esc(s.t)}${ob&&!BAN.has(bk)?`<span class="obv">あからさま：${esc(ob)}</span>`:''}<button class="banbtn" data-canon="${e.sid}~${nx.sid}">${canonPair(e,nx)?'この順番を定番から外す':'この順番を定番に入れる'}</button><button class="banbtn" data-ban="${e.sid}~${nx.sid}">${BAN.has(bk)?'一緒に出さない（登録ずみ・取り消す）':'この2つを一緒に出さない'}</button></span></div>`; }
  });
  return h+'</div>';
}
function timeline(sorted){
  const ys=sorted.map(s=>s.e.y); const lo=Math.min(...ys), hi=Math.max(...ys); const span=Math.max(hi-lo,1);
  return `<div class="tl" aria-hidden="true"><div class="bar"></div>`+sorted.map(({e,i},k)=>{
    const x=6+88*(e.y-lo)/span;
    return `<div class="pt ${k%2?'dn':'up'}" style="left:${x}%"><i></i><span class="lb"><b>${KANA[i]}</b><br>${yv(e)}</span></div>`;
  }).join('')+`</div>`;
}

function renderFill(c){
  const t=c.target;
  let h=`<p class="prompt">次の年表の空欄にあてはまる語句を${S.choice?'選び':'書き'}なさい。</p><div class="nenpyo">`;
  h+=c.rows.map(r=>{
    const isT=r===t;
    const body=isT?(S.answered?esc(r.text).replace('〔〕',`<span class="blank">${esc(r.key)}</span>`):esc(r.text).replace('〔〕','<span class="blank">（　？　）</span>')):filled(r);
    return `<div class="nen${isT?' target':''}"><span class="y">${yv(r)}<small>${yu(r)}</small></span><span class="t"><span>${eraTag(r)}</span><span>${body}</span></span></div>`;
  }).join('')+`</div>`;
  if(S.choice){
    h+=`<div class="choices">`+c.options.map((o,i)=>{
      let cls='choice'; if(S.answered){ if(o===t.key) cls+=' ok'; else if(o===c.given) cls+=' ng'; }
      return `<button class="${cls}" data-opt="${i}" ${S.answered?'disabled':''}><span class="k">${KANA[i]}</span>${esc(o)}</button>`;
    }).join('')+`</div>`;
  }else if(!S.answered){
    h+=`<form class="inp" id="fillForm"><input id="fillIn" autocomplete="off" placeholder="語句を入力（漢字で）" aria-label="答え"><button class="btn primary" type="submit">判定する</button><button class="btn" type="button" data-act="giveup">答えを見る</button></form>`;
  }
  if(S.answered){
    const ok=c.ok;
    h+=`<div class="result ${ok?'ok':'ng'}"><div class="verdict">${ok?'正解':'不正解'}<small>答え：${esc(t.alts.join('／'))}${!S.choice&&c.given?`　（あなたの答え：${esc(c.given)}）`:''}</small></div>
      <div>${yv(t)}${yu(t)}　${filled(t)}</div></div>
      <div class="actions">${!ok&&!S.choice&&c.given?'<button class="btn" data-act="override">正解にする（表記ゆれ）</button>':''}<button class="btn next" data-act="next">次の問題</button></div>`;
  }
  return h;
}

function renderEssay(c){
  const q=c.q;
  let h=`<p class="prompt">${esc(q.q)}</p>`;
  h+=`<p class="es-rule">${essayRule(q,S.hint)}</p>`;
  if(S.hint&&q.use&&q.use.length) h+=`<div class="kw-list"><span style="font-size:12px;color:var(--muted)">次の語句を使って書きなさい</span>${q.use.map(k=>`<span class="kw">${esc(k)}</span>`).join('')}</div>`;
  h+=`<textarea id="essayIn" aria-label="解答欄" placeholder="ここに答えを書く" ${S.answered?'readonly':''}>${esc(c.text||'')}</textarea>`;
  if(!S.answered){
    h+=`<div class="actions"><button class="btn primary" data-act="judge">答え合わせ</button></div>`;
  }else{
    const t=norm(c.text||'');
    const res=q.kw.map(k=>({w:k[0],hit:k.some(a=>t.includes(norm(a)))}));
    const hits=res.filter(r=>r.hit).length;
    const useRes=S.hint?(q.use||[]).map(w=>({w,hit:t.includes(norm(w))})):[];
    h+=`<div class="result neutral">
      <div class="verdict" style="font-size:18px">キーワード ${hits} / ${res.length}</div>
      <div class="kw-list"><span style="font-size:12px;color:var(--muted)">採点キーワード</span>${res.map(r=>`<span class="kw ${r.hit?'hit':'miss'}">${r.hit?'○':'×'} ${esc(r.w)}</span>`).join('')}</div>
      ${useRes.length?`<div class="kw-list"><span style="font-size:12px;color:var(--muted)">指定語句を使ったか</span>${useRes.map(r=>`<span class="kw ${r.hit?'hit':'miss'}">${r.hit?'○':'×'} ${esc(r.w)}</span>`).join('')}</div>`:''}
      <div class="model"><div class="h">解答例</div>${esc(q.a)}</div>
      <div class="self">自己採点：${['○','△','×'].map(s=>`<button data-self="${s}" aria-pressed="${c.self===s}">${s}</button>`).join('')}<span>（○だけ正解として数えます）</span></div>
    </div><div class="actions"><button class="btn next" data-act="next" ${c.self?'':'disabled'}>次の問題</button></div>`;
  }
  return h;
}

function score(ok){
  S.total++; if(ok){S.ok++;S.streak++;}else S.streak=0;
  $('#sTotal').textContent=S.total; $('#sOk').textContent=S.ok; $('#sStreak').textContent=S.streak;

      return `<div class="lk-row"><div class="lk-pair">${evs.map(e=>`<span class="lk-ev"><span class="lk-y">${yv(e)}${yu(e)}</span><b>${esc(e.key)}</b></span>`).join('<span class="lk-ar">・</span>')}<button class="btn sm" data-unbanc="${k}" style="margin-left:auto">元に戻す</button></div></div>`; }).join('')+'</div>';

      `<div class="nen es-row${e.deleted?' gone':''}"><span class="y">${e.y}<small>年ごろ</small></span><span class="t"><span class="top"><span class="era" style="--c:var(${ERA_COLOR[e.era]})">${e.era}</span>${badge(e)}</span>
        <span><b>${hl(esc(e.q))}</b></span><span class="es-a">${hl(esc(e.a))}</span><span class="ths"><span class="th use">指定語句：${esc((e.use||[]).join('・')||'なし')}</span></span><span class="ths">採点：${e.kw.map(k=>`<span class="th">${esc(k.join('／'))}</span>`).join('')}</span></span>
        <span class="rowbtns">${edBtn(e)}</span></div>`).join('')+'</div>';
    q.innerHTML=h+backupHTML(); focusEditor(); return;
  }

function buildSheet(){
  const pr=S.pr; const used=new Set(); const sheet={orders:[],fill:null,essays:[],note:[]};
  for(const ids of S.custom){ const items=shuffle(ids.map(byId).filter(e=>!e.deleted)); sheet.orders.push({theme:'えらんだできごと',custom:ids,items}); items.forEach(e=>used.add(e.id)); }
  const keepLast=S.lastTheme; S.lastTheme=null;
  for(let i=0;i<pr.order;i++){
    S.avoidThemes=sheet.orders.map(o=>o.tk).filter(Boolean);
    let q=makeOrder(S.theme,pr.orderN,used); if(!q){ S.avoidThemes=[]; q=makeOrder(S.theme,pr.orderN,used); }
    if(!q) {sheet.note.push('並び替え問題を指定の数だけ作れませんでした。');break;}
    q.items.forEach(e=>used.add(e.id)); sheet.orders.push({theme:q.theme,tk:q.tk,gx:q.gx,bi:q.bi,items:q.items});
  }
  S.lastTheme=keepLast; S.avoidThemes=[];
  if(pr.fill>0){ sheet.fill=makeFill(pr.fill); if(!sheet.fill) sheet.note.push('年表の穴埋めを作れるだけのできごとがありません。'); }
  sheet.exams=[]; for(let i=0;i<pr.exam;i++){ const q=makeExam('rand',S.theme); if(q) sheet.exams.push(q); }
  const EP=shuffle(essayPool(S.theme)); sheet.essays=EP.slice(0,pr.essay);
  if(pr.essay>EP.length) sheet.note.push(`記述問題は${EP.length}問だけ入れました（この条件の問題が${EP.length}問しかありません）。`);
  S.sheet=sheet;
}

function makeFill(n,tkFixed){
  const P=pool(); let t=tkFixed||S.theme;
  if(t==='auto'){ const c=Object.keys(THEMES).filter(k=>P.filter(e=>e.tags.includes(k)).length>=Math.min(n,6)); t=c.length?rand(c):'mix'; }
  const L = t==='mix'?P:P.filter(e=>e.tags.includes(t));
  const keys=new Set(); const rows=[];
  for(const e of shuffle(L)){ if(!keys.has(e.key)){keys.add(e.key);rows.push(e);} if(rows.length===n)break; }
  if(rows.length<2) return null;
  const f={theme:t==='mix'?'時代をまたいで':THEMES[t],tk:t,rows};
  sortFill(f); return f;
}
function sortFill(f){
  f.rows.sort((a,b)=>a.y-b.y||a.id-b.id);
  const keys=new Set(f.rows.map(r=>r.key));
  // 各行について一番まぎらわしい語句を求め、点数の高いものから語群に加える
  const cands=[]; f.rows.forEach(r=>{ const c=confusables(r,keys)[0]; if(c) cands.push({...c,forKey:r.key}); });
  cands.sort((a,b)=>b.sc-a.sc||a.d-b.d);
  const n=Math.min(4,Math.max(2,Math.ceil(f.rows.length/3))); const used=new Set(); f.extra=[];
  for(const c of cands){ if(used.has(c.key)) continue; used.add(c.key); f.extra.push(c); if(f.extra.length>=n) break; }
  f.bank=[...keys,...f.extra.map(c=>c.key)].sort((a,b)=>a.localeCompare(b,'ja'));
}
function sheetUsed(except){ const u=new Set(); S.sheet.orders.forEach(o=>{ if(o!==except) o.items.forEach(e=>u.add(e.id)); }); return u; }
// 個別の問題の差し替え・削除
function reOrder(i){
  const o=S.sheet.orders[i];
  if(o.custom){ let it; do{ it=shuffle(o.items); }while(o.items.length>2&&it.every((e,k)=>e===o.items[k])); o.items=it; return true; }
  const keep=S.lastTheme; S.lastTheme=o.tk||null;
  const allUsed=new Set(); S.sheet.orders.forEach(x=>x.items.forEach(e=>allUsed.add(e.id)));
  const others=S.sheet.orders.filter(x=>x!==o).map(x=>x.tk).filter(Boolean);
  const nn=S.pr.orderN==='r'?'r':o.items.length;
  let q=null;
  // 1) 今の問題とほかの問題のできごとをすべて除き、まだ使っていないテーマから
  S.exclude=allUsed; S.avoidThemes=[o.tk,...others].filter(Boolean);
  for(let t=0;t<6&&!q;t++) q=makeOrder(S.theme,nn,allUsed);
  // 2) テーマの制限をゆるめる（できごとの重なりは許さない）
  if(!q){ S.avoidThemes=[o.tk].filter(Boolean); for(let t=0;t<6&&!q;t++) q=makeOrder(S.theme,nn,allUsed); }
  // 3) 今の問題のできごとだけは必ず除く
  if(!q){ S.exclude=new Set(o.items.map(e=>e.id)); S.avoidThemes=[]; for(let t=0;t<6&&!q;t++) q=makeOrder(S.theme,nn,allUsed); }
  S.exclude=null; S.avoidThemes=[]; S.lastTheme=keep;
  if(!q){ S.sheet.note=['この問題と入れ替えられる別の組み合わせが見つかりませんでした。']; return false; }
  S.sheet.orders[i]={theme:q.theme,tk:q.tk,gx:q.gx,bi:q.bi,items:q.items}; return true;
}
function addOrder(){
  const q=makeOrder(S.theme,S.pr.orderN,sheetUsed());
  if(!q){ S.sheet.note=['追加できる並び替え問題が見つかりませんでした。']; return; }
  S.sheet.orders.push({theme:q.theme,tk:q.tk,gx:q.gx,bi:q.bi,items:q.items});
}
function reFillRow(r){
  const f=S.sheet.fill; const cur=f.rows[r]; const keys=new Set(f.rows.map(x=>x.key));
  const P=pool(); const L=(f.tk==='mix'?P:P.filter(e=>e.tags.includes(f.tk))).filter(e=>!keys.has(e.key));
  let c=L; if(!c.length){ c=P.filter(e=>!keys.has(e.key)&&Math.abs(e.y-cur.y)<=150); }
  if(!c.length){ S.sheet.note=['入れ替えられるできごとが見つかりませんでした。']; return; }
  f.rows[r]=rand(c); sortFill(f);
}
function addFillRow(){
  const f=S.sheet.fill; if(f.rows.length>=MARU.length) return;
  const keys=new Set(f.rows.map(x=>x.key)); const P=pool();
  const c=(f.tk==='mix'?P:P.filter(e=>e.tags.includes(f.tk))).filter(e=>!keys.has(e.key));

function genCands(k,append){
  // 作り直すときも、選んでいる問題は残す
  if(!append) S.cands=(S.cands||[]).filter(x=>x.sel);
  const base=S.cands.length;
  const seen=new Set(S.cands.map(c=>c.items.map(e=>e.id).sort().join(',')));
  const used=new Set(); S.cands.forEach(c=>c.items.forEach(e=>used.add(e.id)));
  const keep=S.lastTheme; let fails=0;
  while(S.cands.length<base+k&&fails<k*4){
    S.avoidThemes=S.cands.slice(-3).map(c=>c.tk).filter(Boolean);
    const q=makeOrder(S.theme,S.pr.orderN,used);
    S.avoidThemes=[];
    if(!q){ fails++; continue; }
    const key=q.items.map(e=>e.id).sort().join(',');
    if(seen.has(key)){ fails++; continue; }
    seen.add(key); q.items.forEach(e=>used.add(e.id));
    S.cands.push({theme:q.theme,tk:q.tk,gx:q.gx,bi:q.bi,items:q.items,sel:false});
    if(append&&S.cands.length>=S.candTarget) break;
  }
  S.lastTheme=keep;
}

    <p class="hint-line">印刷はA4たて向き。このプレビュー画面では印刷ボタンがはたらかないことがあります。そのときはダウンロード版のHTMLファイルをブラウザで開いて印刷してください。</p>

  </div>${candsHTML()}${essCandsHTML()}<div id="sheets">${sheetHTML(sh)}</div>`;

// 問題用紙が A4 何枚分になるかを測る（印刷時と同じ幅・余白で、ボタン類を除いて）
function sheetPages(){
  const art=document.querySelector('#sheets article.sheet:not(.ans-sheet)'); if(!art) return 0;
  const box=document.createElement('div'); box.className='measure'; box.innerHTML='<div class="mm"></div>'+art.outerHTML; document.body.appendChild(box);
  const mm=box.querySelector('.mm').getBoundingClientRect().width/100;
  const h=box.querySelector('article').getBoundingClientRect().height; box.remove();
  return h/(270*mm); // 277mmのうち少し余裕をもたせる
}
function showPages(){
  const el=document.getElementById('pgInfo'); if(!el) return; const n=sheetPages();
  el.textContent=n<=1?'問題用紙は1枚に収まっています':n<1.1?'問題用紙が少しだけ1枚をこえています（2枚になります）':`問題用紙は約${n.toFixed(1)}枚分（${Math.ceil(n)}枚になります）`;
  el.classList.toggle('over',n>1); const b=document.getElementById('fit1'); if(b) b.hidden=n<=1;
}
// 1枚に収まるまで問題を減らす（入試形式→並び替え→穴埋め→記述の順に、少しずつ）
// 作り直すとき、1枚に収まる組み合わせが出るまで何回か作り直す（もとが1枚のときだけ）
function rebuildFit(){
  const was=sheetPages()<=1; let best=null,bp=99;
  for(let t=0;t<(was?6:1);t++){ buildSheet(); renderPrint(); const n=sheetPages(); if(n<bp){bp=n;best=S.sheet;} if(n<=1) return; }
  S.sheet=best; renderPrint();
}
function fitOnePage(){
  const sh=S.sheet; if(!sh) return;
  for(let t=0;t<30;t++){
    renderPrint(); if(sheetPages()<=1) break;
    const nCustom=S.custom.length;
    if(sh.exams&&sh.exams.length>1) sh.exams.pop();
    else if(sh.orders.length>Math.max(2,nCustom)) sh.orders.pop();
    else if(sh.fill&&sh.fill.rows.length>4){ const f=makeFill(sh.fill.rows.length-2,sh.fill.tk); if(f) sh.fill=f; else break; }
    else if(sh.essays.length) sh.essays.pop();
    else if(sh.exams&&sh.exams.length) sh.exams.pop();
    else if(sh.orders.length>Math.max(1,nCustom)) sh.orders.pop();
    else break;
  }
  const pr=S.pr; pr.order=Math.max(0,sh.orders.length-S.custom.length); pr.fill=sh.fill?sh.fill.rows.length:0; pr.exam=(sh.exams||[]).length; pr.essay=sh.essays.length;
  renderPrint();
}

function sheetHTML(sh){

      <div class="ansline">（ ${o.items.map(()=>'<span class="box"></span>').join(' → ')} ）</div></div></li>`).join('')+`</ol><div class="addrow"><button class="tbtn" data-q="add-order">＋ 並び替えを1問追加</button></div></section>`;
    a+=`<section class="dai"><h4><span class="dn">${dai}</span>並び替え</h4><ol class="alist">`+sh.orders.map((o,i)=>{
      const c=correctOrder(o.items);
      const st=flowSteps(c.map(k=>o.items[k]),o.tk,o.gx,o.bi);
      const why=st.map((x,k)=>x.kind==='cause'||x.kind==='genre'?`<span class="why">${KANA[c[k]]}→${KANA[c[k+1]]}：${esc(x.t)}</span>`:'').join('');
      const bs=o.bi!=null&&BANK[o.bi]?`<span class="why bsum">【${esc(BANK[o.bi].ti)}】${esc(BANK[o.bi].sum)}　<b>覚え方</b>：${esc(BANK[o.bi].tip)}</span>`:'';
      return `<li>(${i+1}) <b>${c.map(k=>KANA[k]).join(' → ')}</b><span class="ay">${c.map(k=>`${KANA[k]} ${yv(o.items[k])}${yu(o.items[k])}`).join('／')}</span>${bs}${why}</li>`;}).join('')+`</ol></section>`;
  }
  if(sh.fill){
    dai++; const f=sh.fill;
    q+=`<section class="dai"><h4><span class="dn">${dai}</span>次の年表の ${MARU[0]}〜${MARU[f.rows.length-1]} にあてはまる語句を${pr.bank?'、下の語群から選んで':''}答えなさい。</h4>
      <div class="addrow top"><span class="qtools"><button class="tbtn" data-q="re-fill" data-qi="0">年表ごと作り直す</button><button class="tbtn del" data-q="rm-fill" data-qi="0">消す</button></span></div>
      <table class="snen"><tbody>${f.rows.map((r,i)=>`<tr><td class="y">${yv(r)}${yu(r)}</td><td>${esc(r.text).replace('〔〕',`<span class="sblank">${MARU[i]}</span>`)}</td><td class="rowtool"><button class="tbtn" data-q="re-frow" data-qi="${i}" title="この行を変える">変える</button>${f.rows.length>2?`<button class="tbtn del" data-q="rm-frow" data-qi="${i}">消す</button>`:''}</td></tr>`).join('')}</tbody></table>
      <div class="addrow"><button class="tbtn" data-q="add-frow">＋ 年表に1行追加</button></div>
      ${pr.bank?`<div class="bank"><span class="bl">語群</span>${f.bank.map(k=>`<span>${esc(k)}</span>`).join('')}</div>`:''}
      <div class="agrid">${f.rows.map((r,i)=>`<div><span>${MARU[i]}</span></div>`).join('')}</div></section>`;
    a+=`<section class="dai"><h4><span class="dn">${dai}</span>年表の穴埋め</h4><div class="agrid ans">${f.rows.map((r,i)=>`<div><span>${MARU[i]}</span>${esc(r.alts.join('／'))}</div>`).join('')}</div>${pr.bank&&f.extra&&f.extra.length?`<ol class="alist" style="margin-top:4px">${f.extra.map(c=>`<li><span class="why">語群の「${esc(c.key)}」は${ySpan(c.x)}の語句（「${esc(c.forKey)}」とまぎらわしい：${esc(c.why.slice(0,2).join('・'))}）。</span></li>`).join('')}</ol>`:''}</section>`;
  }
  if(sh.exams&&sh.exams.length){
    dai++;
    q+=`<section class="dai"><h4><span class="dn">${dai}</span>次の問いに答えなさい。</h4>`+sh.exams.map((x,i)=>`<div class="sx">${tools('exam',i)}<p>(${i+1}) ${x.stem}</p>${x.table?`<div class="xtbl">${x.table}</div>`:''}${x.box?`<div class="xbox">${x.box}</div>`:''}${x.write?`<div class="xwrite">（　　）→（　　）→（　　）</div>`:`<div class="xopts${x.short?' short':''}">${x.options.map((o,k)=>`<span><b>${x.labels[k]}</b> ${o}</span>`).join('')}</div>`}</div>`).join('')+
      `<div class="addrow"><button class="tbtn" data-q="add-exam">＋ 入試形式を1問追加</button></div></section>`;
    a+=`<section class="dai"><h4><span class="dn">${dai}</span>入試形式</h4><ol class="alist">${sh.exams.map((x,i)=>`<li>(${i+1}) <b>${x.write?x.writeAns:x.labels[x.ans]}</b><span class="ay">${x.expl}</span>${x.det&&x.det.opts&&x.fmt!=='interval'?`<span class="why">${x.det.opts.map(o=>o.replace(/<[^>]+>/g,'')).join('<br>')}</span>`:''}${x.det&&x.det.hint?`<span class="why">${x.det.hint}</span>`:''}</li>`).join('')}</ol></section>`;
  }
  if(sh.essays.length){
    dai++;
    q+=`<section class="dai"><h4><span class="dn">${dai}</span>次の問いに答えなさい。</h4>`+sh.essays.map((e,i)=>`<div class="sess">${tools('essay',i)}${e.use&&e.use.length?`<span class="qtools"><button class="tbtn" data-q="tg-use" data-qi="${i}">${useOn(sh,i)?'語句を消す':'語句をつける'}</button></span>`:''}<p>(${i+1}) ${esc(e.q)}<span class="skw">${essayRule(e,useOn(sh,i))}</span></p><div class="lines"></div></div>`).join('')+`<div class="addrow"><button class="tbtn" data-q="add-essay">＋ 記述を1問追加</button></div></section>`;
    a+=`<section class="dai"><h4><span class="dn">${dai}</span>記述（解答例）</h4><ol class="alist">${sh.essays.map((e,i)=>`<li>(${i+1}) ${esc(e.a)}<span class="ay">採点のポイント：${e.kw.map(k=>esc(k[0])).join('・')}</span></li>`).join('')}</ol></section>`;
  }
  if(!dai) return '<div class="empty">問題がありません。<div class="addrow"><button class="tbtn" data-q="add-order">＋ 並び替えを追加</button><button class="tbtn" data-q="add-fill">＋ 年表の穴埋めを追加</button><button class="tbtn" data-q="add-essay">＋ 記述を追加</button></div></div>';
  const missing=[!sh.orders.length&&'<button class="tbtn" data-q="add-order">＋ 並び替えを追加</button>',!sh.fill&&'<button class="tbtn" data-q="add-fill">＋ 年表の穴埋めを追加</button>',!(sh.exams&&sh.exams.length)&&'<button class="tbtn" data-q="add-exam">＋ 入試形式を追加</button>',!sh.essays.length&&'<button class="tbtn" data-q="add-essay">＋ 記述を追加</button>'].filter(Boolean).join('');
  if(missing) q+=`<div class="addrow">${missing}</div>`;
  let out=`<article class="sheet">${head('')}${q}</article>`;
  if(pr.answers) out+=`<article class="sheet ans-sheet">${head('解答')}${a}</article>`;
  return out;
}

/* ---------- 操作 ---------- */
function setMode(m){S.mode=m;try{localStorage.setItem('rk-mode',m)}catch(e){} S.lastTheme=null;renderControls();newQuestion();window.scrollTo({top:0});}
document.addEventListener('click',ev=>{
  const b=ev.target.closest('button'); if(!b) return;
  const c=S.cur;
  if(b.dataset.mode){S.editing=null;setMode(b.dataset.mode);return;}
  if(b.dataset.edrank){ S.edRank=b.dataset.edrank; document.querySelectorAll('[data-edrank]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.edrank===S.edRank)); return; }
  if(b.dataset.edit){S.edRank=null;S.editing=b.dataset.edit;S.editFocus=true;renderList();return;}
  if(b.dataset.revive){b.disabled=true;setDeleted(b.dataset.revive,false).then(()=>{S.flash='復活しました。';renderList();});return;}
  if(b.dataset.restore!==undefined){const sid=S.editing; const rec=EDITS[sid]; const v=b.dataset.restore==='orig'?origOf(sid):rec.history[+b.dataset.restore].v; b.disabled=true;
    saveVersion(sid,clone(v)).then(ok=>{ if(ok){S.flash='文章をもどしました。';} renderList(); }); return;}
  if(b.dataset.lk){S.listKind=b.dataset.lk;S.editing=null;renderControls();renderList();return;}
  if(b.dataset.lf){S.listFilter=b.dataset.lf;S.editing=null;renderControls();renderList();return;}
  if(b.dataset.era){ if(S.eras.has(b.dataset.era)){ if(S.eras.size>1) S.eras.delete(b.dataset.era);} else S.eras.add(b.dataset.era); renderControls(); newQuestion(); return;}
  if(b.dataset.themePick){S.listTheme=S.listTheme===b.dataset.themePick?'all':b.dataset.themePick;renderControls();renderList();$('.list-head').scrollIntoView({block:'start',behavior:'smooth'});return;}
  if(b.dataset.sel!==undefined){const id=+b.dataset.sel; S.sel.has(id)?S.sel.delete(id):S.sel.add(id);
    const row=b.closest('.nen'); const on=S.sel.has(id); row.classList.toggle('on',on); b.setAttribute('aria-pressed',on); b.textContent=on?'✓':'＋'; renderSelBar(); return;}
  if(b.dataset.unbanc){ unbanCombo(b.dataset.unbanc); S.flash='元に戻しました。'; renderList(); return; }
  if(b.dataset.rkup||b.dataset.rkdn){ const sid=b.dataset.rkup||b.dataset.rkdn; const it=itemOf(sid); const ord=['A','B','C']; const i=ord.indexOf(it.rank)+(b.dataset.rkup?-1:1); if(i<0||i>2) return;
    const y=window.scrollY; setRank(sid,ord[i]).then(()=>{ if(S.mode==='list') renderList(); else if(S.mode==='print') renderPrint(); else render(); window.scrollTo({top:y}); }); return; }
  if(b.dataset.canon){ const k=b.dataset.canon.split('~').sort().join('~'); const cur=!!canonPair(...b.dataset.canon.split('~').map(bySid));
    if(cur){ CANON_U.add.delete(k); CANON_U.del.add(k); } else { CANON_U.del.delete(k); CANON_U.add.add(k); } saveCanon(); render(); return; }
  if(b.dataset.rank){ const k=b.dataset.rank; if(S.ranks.includes(k)){ if(S.ranks.length>1) S.ranks=S.ranks.filter(x=>x!==k); } else S.ranks=[...S.ranks,k].sort(); renderControls(); newQuestion(); return; }
  if(b.hasAttribute('data-rw')){ S.rankWeight=!S.rankWeight; renderControls(); newQuestion(); return; }
  if(b.hasAttribute('data-world')){S.world=!S.world;renderControls();newQuestion();return;}
  if(ev.target.closest('[data-esdel]')){ const sid=ev.target.closest('[data-esdel]').dataset.esdel; const y=window.scrollY;
    setDeleted(sid,true).then(()=>{ if(S.esSel) S.esSel.delete(sid); if(S.sheet){ S.sheet.essays=S.sheet.essays.filter(e=>e.sid!==sid); S.pr.essay=S.sheet.essays.length; S.sheet.note=['記述問題を1問消しました。一覧の「消したもの」からいつでも復活できます。']; } renderPrint(); window.scrollTo({top:y}); }); return; }
  if(ev.target.closest('[data-cdel]')){ const i=+ev.target.closest('[data-cdel]').dataset.cdel; banCombo(S.cands[i].items); S.cands.splice(i,1); const y=window.scrollY; renderPrint(); window.scrollTo({top:y}); return; }
  if(b.dataset.es!==undefined){ S.esSel=S.esSel||new Set(); const k=b.dataset.es; S.esSel.has(k)?S.esSel.delete(k):S.esSel.add(k); const y=window.scrollY; renderPrint(); window.scrollTo({top:y}); return; }
  if(b.dataset.cand!==undefined){ const x=S.cands[+b.dataset.cand]; x.sel=!x.sel; const y=window.scrollY; renderPrint(); window.scrollTo({top:y}); return; }
  if(b.dataset.q&&S.sheet){
    const i=+(b.dataset.qi||0), sh=S.sheet; sh.note=[];
    switch(b.dataset.q){
      case 're-order': reOrder(i); break;
      case 'ban-order': { const o=sh.orders[i]; banCombo(o.items); reOrder(i); sh.note=['この並び替えを削除し、別の問題に差しかえました。年表一覧の「削除した並び替え」から元に戻せます。']; break; }
      case 'rm-order': { const o=sh.orders[i]; if(o.custom) S.custom=S.custom.filter(ids=>ids!==o.custom); sh.orders.splice(i,1); break; }
      case 'add-order': addOrder(); break;
      case 're-fill': sh.fill=makeFill(sh.fill.rows.length,sh.fill.tk==='mix'?'mix':(S.theme==='auto'?'auto':sh.fill.tk)); break;
      case 'rm-fill': sh.fill=null; break;
      case 'add-fill': sh.fill=makeFill(S.pr.fill||8); if(!sh.fill) sh.note=['年表の穴埋めを作れるだけのできごとがありません。']; break;
      case 're-frow': reFillRow(i); break;
      case 'rm-frow': sh.fill.rows.splice(i,1); sortFill(sh.fill); break;
      case 'add-frow': addFillRow(); break;
      case 're-essay': reEssay(i); break;
      case 'rm-essay': sh.essays.splice(i,1); break;
      case 'add-essay': addEssay(); break;
      case 'tg-use': { sh.noUse=sh.noUse||{}; const k=sh.essays[i].id; sh.noUse[k]=!useOn(sh,i); break; }
      case 're-exam': { const q=makeExam('rand',S.theme); if(q) sh.exams[i]=q; break; }
      case 'rm-exam': sh.exams.splice(i,1); break;
      case 'add-exam': { const q=makeExam('rand',S.theme); if(q){ sh.exams=sh.exams||[]; sh.exams.push(q);} else sh.note=['この条件では入試形式の問題を作れませんでした。']; break; }
    }
    const y=window.scrollY; renderPrint(); window.scrollTo({top:y}); return;
  }
  if(b.dataset.imp){S.ordImp=b.dataset.imp;renderControls();if(S.mode==='print'){buildSheet();renderPrint();}else newQuestion();return;}
  if(b.dataset.obv){S.noObvious=b.dataset.obv==='1';renderControls();if(S.mode==='print'){buildSheet();renderPrint();}else newQuestion();return;}
  if(b.dataset.ban){ const [x,y]=b.dataset.ban.split('~'); const k=[x,y].sort().join('~'); if(BAN.has(k)) BAN.delete(k); else BAN.add(k); saveBan(); render(); return; }
  if(b.dataset.span){S.span=b.dataset.span;renderControls();if(S.mode==='print'){buildSheet();renderPrint();}else newQuestion();return;}
  if(b.dataset.omode){S.omode=b.dataset.omode;renderControls();if(S.mode==='print'){buildSheet();renderPrint();}else newQuestion();return;}
  if(b.dataset.n){S.n=b.dataset.n==='r'?'r':+b.dataset.n;renderControls();newQuestion();return;}
  if(b.dataset.choice){S.choice=b.dataset.choice==='1';renderControls();if(S.answered)newQuestion();else render();return;}
  if(b.dataset.hintset){S.hint=b.dataset.hintset==='1';renderControls();if(c) c.text=($('#essayIn')||{}).value??c.text;render();return;}
  if(b.dataset.prhint){S.hint=b.dataset.prhint==='1'; if(S.sheet) S.sheet.noUse={}; renderPrint();return;}
  if(b.hasAttribute('data-prbank')){S.pr.bank=!S.pr.bank;renderPrint();return;}
  if(b.hasAttribute('data-prans')){S.pr.answers=!S.pr.answers;renderPrint();return;}
  if(b.dataset.rmcustom!==undefined){S.custom.splice(+b.dataset.rmcustom,1);buildSheet();renderPrint();return;}
  if(b.dataset.xf){S.examFmt=b.dataset.xf;renderControls();newQuestion();return;}
  if(b.dataset.xo!==undefined&&c&&!S.answered){c.given=+b.dataset.xo;S.answered=true;score(c.given===c.ans);render();return;}
  if(b.dataset.opt!==undefined&&c){judgeFill(c.options[+b.dataset.opt]);return;}
  if(b.dataset.pick!==undefined&&c){c.picked.push(+b.dataset.pick);render();return;}
  if(b.dataset.slot!==undefined&&c){c.picked.splice(+b.dataset.slot,1);render();return;}
  if(b.dataset.self&&c){const first=!c.self;c.self=b.dataset.self;if(first)score(c.self==='○');else{ const prevOk=c.prevSelf==='○',nowOk=c.self==='○'; if(prevOk!==nowOk){S.ok+=nowOk?1:-1;$('#sOk').textContent=S.ok;} }
    c.prevSelf=c.self;render();return;}
  switch(b.dataset.act){
    case 'reset': c.picked=[];render();break;
    case 'judge':
      if(c.type==='order'){S.answered=true;score(orderOk(c));render();}
      if(c.type==='essay'){c.text=$('#essayIn').value;S.answered=true;render();}
      break;
    case 'giveup': judgeFill('');break;
    case 'override': if(!c.ok){c.ok=true;S.ok++;S.streak++;$('#sOk').textContent=S.ok;$('#sStreak').textContent=S.streak;render();}break;
    case 'next': newQuestion();break;
    case 'bancur': banCombo(c.items); S.flash2='この並び替えを削除しました。年表一覧の「削除した並び替え」から元に戻せます。'; newQuestion(); break;
    case 'selclear': S.sel.clear(); if(S.mode==='list') renderList(); renderSelBar(); break;
    case 'selplay': {
      const ids=[...S.sel]; S.mode='order'; renderControls(); S.answered=false; S.cur=customQuestion(ids); S.qno++; render(); window.scrollTo({top:0}); break; }
    case 'selprint': {
      S.custom.push([...S.sel]); S.sel.clear(); S.mode='print'; try{localStorage.setItem('rk-mode','print')}catch(e){} renderControls(); newQuestion(); window.scrollTo({top:0}); break; }
    case 'retry': S.answered=false; S.cur=customQuestion(c.custom); S.qno++; render(); break;
    case 'tolist': case 'tolist2': setMode('list'); break;
    case 'rebuild': rebuildFit(); break;
    case 'fit1': fitOnePage(); break;
    case 'esopen': S.esOpen=true; renderPrint(); break;
    case 'esclose': S.esOpen=false; renderPrint(); break;
    case 'esclear': S.esSel=new Set(); { const y=window.scrollY; renderPrint(); window.scrollTo({top:y}); } break;
    case 'esadd': case 'esreplace': {
      const picked=ESSAY.filter(e=>!e.deleted&&S.esSel.has(e.sid));
      if(b.dataset.act==='esreplace') S.sheet.essays=picked.slice();
      else { const have=new Set(S.sheet.essays.map(e=>e.sid)); S.sheet.essays.push(...picked.filter(e=>!have.has(e.sid))); }
      S.pr.essay=S.sheet.essays.length; S.esSel=new Set();
      S.sheet.note=[`記述を${picked.length}問${b.dataset.act==='esreplace'?'に置きかえました':'追加しました'}。`];
      renderPrint(); document.getElementById('sheets').scrollIntoView({behavior:'smooth'}); break; }
    case 'copen': S.candOpen=true; if(!S.cands||!S.cands.length) genCands(20); renderPrint(); break;
    case 'cclose': S.candOpen=false; renderPrint(); break;
    case 'cexp': S.candExpAll=!S.candExpAll; { const y=window.scrollY; renderPrint(); window.scrollTo({top:y}); } break;
    case 'cgen': genCands(20); renderPrint(); break;
    case 'cmore': S.candTarget=(S.cands||[]).length+20; genCands(20,true); renderPrint(); break;
    case 'cclear': S.cands.forEach(x=>x.sel=false); renderPrint(); break;
    case 'cadd': case 'creplace': {
      const picked=S.cands.filter(x=>x.sel).map(x=>({theme:x.theme,tk:x.tk,gx:x.gx,bi:x.bi,items:x.items.slice()}));
      if(b.dataset.act==='creplace'){ S.sheet.orders=picked; S.custom=[]; } else S.sheet.orders.push(...picked);
      S.cands.forEach(x=>x.sel=false); S.sheet.note=[`並び替えを${picked.length}問${b.dataset.act==='creplace'?'に置きかえました':'追加しました'}。`];
      renderPrint(); document.getElementById('sheets').scrollIntoView({behavior:'smooth'}); break; }
    case 'edcancel': S.editing=null; renderList(); break;
    case 'edsave': { const sid=S.editing; const r=readEditor(sid); if(r.err){$('#edErr').textContent=r.err;break;} b.disabled=true;
      saveVersion(sid,r.v).then(async ok=>{
        if(ok&&ITEM[sid].kind==='ev'&&S.edRank&&S.edRank!==itemOf(sid).rank){ const o=baseRec(sid); o.rank=S.edRank===itemOf(sid).rank0?null:S.edRank; o.updatedAt=Date.now(); ok=await Store.put(sid,o); }
        if(ok){S.editing=null;S.edRank=null;S.flash='保存しました。';} renderList(); }); break; }
    case 'eddel': { const sid=S.editing; S.editing=null; if(ITEM[sid].kind==='ev') S.sel.delete(itemOf(sid).id); b.disabled=true;
      setDeleted(sid,true).then(()=>{ S.flash='消しました。「消したもの」からいつでも復活できます。'; renderList(); renderSelBar(); }); break; }
    case 'bkcopy': { const t=$('#bkOut'); const done=()=>{b.textContent='コピーしました';}; try{ navigator.clipboard.writeText(t.value).then(done,()=>{t.select();}); }catch(e){ t.select(); } break; }
    case 'bkimport': { let m; try{ m=JSON.parse($('#bkIn').value); }catch(e){ S.flash='貼り付けた文字を読み取れませんでした。コピーした内容をそのまま貼り付けてください。'; renderList(); break; }
      b.disabled=true; if(Array.isArray(m.__ban)){ m.__ban.forEach(x=>BAN.add(x)); saveBan(); } if(Array.isArray(m.__bancombo)){ m.__bancombo.forEach(k=>{ if(!BANC.includes(k)) BANC.push(k); }); saveBanC(); } if(m.__canon){ (m.__canon.add||[]).forEach(x=>CANON_U.add.add(x)); (m.__canon.del||[]).forEach(x=>CANON_U.del.add(x)); saveCanon(); } (async()=>{ let n=0; for(const k in m){ if(ITEM[k]&&m[k]&&typeof m[k]==='object'){ await Store.put(k,m[k]); n++; } } S.flash=`${n}件の編集データを取り込みました。`; renderList(); })(); break; }
    case 'print': try{ window.print(); }catch(e){} break;
  }
});
document.addEventListener('change',ev=>{
  const id=ev.target.id, v=ev.target.value;
  if(id==='themeSel'){S.listTheme=v;renderList();}
  if(id==='genTheme'){S.theme=v;S.lastTheme=null;const bn=document.querySelector('.bankn'); if(bn&&S.omode==='bank') bn.textContent=`この条件で ${bankFor(S.theme,S.n).length} 問`;newQuestion();}
  if(id==='prOrder'){S.pr.order=+v;buildSheet();renderPrint();}
  if(id==='prOrderN'){S.pr.orderN=v==='r'?'r':+v;buildSheet();renderPrint();}
  if(id==='prFill'){S.pr.fill=+v;buildSheet();renderPrint();}
  if(id==='prExam'){S.pr.exam=+v;buildSheet();renderPrint();}
  if(id==='prEssay'){S.pr.essay=+v;buildSheet();renderPrint();}
});
document.addEventListener('input',ev=>{
  if(ev.target.id==='listQ'){S.q=ev.target.value;renderList();}
  if(ev.target.id==='prTitle'){S.pr.title=ev.target.value; document.querySelectorAll('.sh-title').forEach(t=>{const sub=t.querySelector('.sh-sub'); t.textContent=S.pr.title; if(sub) t.appendChild(sub);});}
});
document.addEventListener('submit',ev=>{
  if(ev.target.id==='fillForm'){ev.preventDefault();const v=$('#fillIn').value.trim(); if(v) judgeFill(v);}
});
function judgeFill(v){
  const c=S.cur; if(S.answered) return;
  c.given=v; c.ok=!!v&&c.target.alts.some(a=>norm(a)===norm(v));
  S.answered=true; score(c.ok); render();
}
document.addEventListener('keydown',ev=>{
  if(document.body.dataset.subj&&document.body.dataset.subj!=='rk') return;
  if(ev.key!=='Enter'||ev.isComposing) return;
  if(!['order','fill','essay','exam'].includes(S.mode)) return;
  const tag=(ev.target.tagName||'').toLowerCase();
  if(['textarea','button','input','select'].includes(tag)) return;
  if(S.answered){ const n=$('[data-act="next"]'); if(n&&!n.disabled){ev.preventDefault();newQuestion();} }
  else { const j=$('[data-act="judge"]'); if(j&&!j.disabled){ev.preventDefault();j.click();} }
});

Store.loadLocal();
renderControls();
newQuestion();
})();
</script>

function distract(f,n,ban){
  const bad=new Set([...f.alts.map(norm),...(ban||[]).map(norm)]);
  const all=D().facts.filter(x=>!DEL.has(x.id)&&x.c===f.c&&!bad.has(norm(x.key)));
  const uniq=[]; const seen=new Set();
  for(const x of shuffle(all).sort((a,b)=>(b.u===f.u)-(a.u===f.u))){ const k=norm(x.key); if(!seen.has(k)){seen.add(k);uniq.push(x.key);} }
  return uniq.slice(0,n);
}

function mkCombo(){
  const P=fresh(facts(),2);
  for(let t=0;t<30;t++){
    const a=rand(P); const same=P.filter(x=>x!==a&&x.u===a.u&&norm(x.key)!==norm(a.key));
    const b=rand(same.length?same:P.filter(x=>x!==a)); if(!b) return null;
    const da=distract(a,1,[b.key])[0], db=distract(b,1,[a.key,da])[0]; if(!da||!db) continue;
    remember([a,b]);
    const combos=shuffle([[a.key,b.key],[a.key,db],[da,b.key],[da,db]]);
    const ans=combos.findIndex(c=>c[0]===a.key&&c[1]===b.key);
    return {type:'exam',fmt:'combo',
      stem:'次の文章中の <b>Ⅰ</b> 、 <b>Ⅱ</b> にあてはまる語の組み合わせとして最も適当なものを、次のア〜エのうちから一つ選び、その符号を答えなさい。',
      box:`<p>${fill(a,'<span class="sblank">Ⅰ</span>')}</p><p>${fill(b,'<span class="sblank">Ⅱ</span>')}</p>`,
      labels:KANA.slice(0,4), opts:combos.map(c=>`Ⅰ：${esc(c[0])}　　Ⅱ：${esc(c[1])}`), ans,

}

function mkTF(){

  const st=two.map((f,i)=>{ if(truth[i]) return {f,txt:fill(f,esc(f.key))}; const d=distract(f,1)[0]; if(!d){truth[i]=true;return {f,txt:fill(f,esc(f.key))};} return {f,txt:fill(f,esc(d)),wrong:d}; });
  remember(two);
  const opts=[[1,1],[1,0],[0,1],[0,0]]; const ans=opts.findIndex(o=>o[0]===+truth[0]&&o[1]===+truth[1]);
  return {type:'exam',fmt:'tf',stem:'次の文X、Yの正誤の組み合わせとして最も適当なものを、次のア〜エのうちから一つ選び、その符号を答えなさい。',

}

function mkWrong(){

function mkJisa(){

  if(kind<0.3){
    const ans=Math.abs(diff); const set=new Set([ans]); for(const v of shuffle([ans-1,ans+1,ans+2,ans-2,ans*2,Math.abs(ans-3)+1,ans+3])){ if(v>0&&v<=24) set.add(v); if(set.size>=4) break; }

  }

// ドント式の議席配分（公民）
function mkDhondt(){
  if(G.subj!=='ko') return null;
  for(let t=0;t<30;t++){
    const names=['A党','B党','C党','D党'].slice(0,3+(Math.random()<0.5?1:0));
    const seats=4+Math.floor(Math.random()*3);
    const votes=names.map(()=>(2+Math.floor(Math.random()*13))*1000).sort((a,b)=>b-a);
    const q=[]; names.forEach((n,i)=>{ for(let k=1;k<=seats;k++) q.push({i,v:votes[i]/k,k}); });
    q.sort((a,b)=>b.v-a.v);
    if(q[seats-1].v===q[seats].v) continue;
    const got=names.map((n,i)=>q.slice(0,seats).filter(x=>x.i===i).length);
    if(new Set(votes).size<votes.length) continue;
    const ti=Math.random()<0.5?1:2; const ans=got[ti];
    const opts=[...new Set([ans,ans+1,Math.max(0,ans-1),ans+2,0,1,2,3])].slice(0,4).sort((a,b)=>a-b);
    const tbl=`<table class="xnen gtbl"><tbody><tr><td></td>${names.map(n=>`<td>${n}</td>`).join('')}</tr><tr><td>得票数</td>${votes.map(v=>`<td>${v.toLocaleString()}</td>`).join('')}</tr></tbody></table>`;
    const mk=Math.max(3,...q.slice(0,seats).map(x=>x.k)); const steps=Array.from({length:mk},(_,i)=>i+1).map(k=>`÷${k}：${votes.map(v=>Math.round(v/k).toLocaleString()).join('／')}`).join('<br>');
    return {type:'exam',fmt:'dhondt',stem:`定数${seats}の比例代表選挙で、各政党の得票数が次の表のようになった。ドント式で議席を配分したとき、${names[ti]}の獲得議席数として最も適当なものを、次のア〜エのうちから一つ選び、その符号を答えなさい。`,
      box:tbl,labels:KANA.slice(0,4),opts:opts.map(v=>v+'議席'),ans:opts.indexOf(ans),
      expl:`各党の得票数を1、2、3…で割り、商の大きい順に${seats}議席を配分する。<br>${steps}<br>結果：${names.map((n,i)=>`${n} ${got[i]}議席`).join('、')}。${names[ti]}は<b>${ans}議席</b>。`};
  }
  return null;
}

const PYR={

function pyramid(type){

function dsFig(opt){

  b+=T(o-4,16,'価格',{fs:11,a:'end'})+T(W-12,H-o+16,'数量',{fs:11,a:'end'});
  const D=(dx)=>`<line x1="${o+20+dx}" y1="30" x2="${W-30+dx}" y2="${H-o-10}" stroke="currentColor" stroke-width="2"/>`;
  const S=(dx)=>`<line x1="${o+20+dx}" y1="${H-o-10}" x2="${W-30+dx}" y2="30" stroke="currentColor" stroke-width="2" stroke-dasharray="${opt.sDash?'5 3':'0'}"/>`;
  b+=D(0)+T(W-26,H-o-12,'A',{fs:12,b:1,a:'start'})+S(0)+T(W-26,32,'B',{fs:12,b:1,a:'start'});

}

function choices(c){
  if(c.multi){ const sel=c.sel||[]; return `<div class="choices long">`+c.opts.map((o,i)=>{ let cls='choice'; if(G.answered){ if(c.ansSet.includes(i)) cls+=' ok'; else if(sel.includes(i)) cls+=' ng'; } else if(sel.includes(i)) cls+=' picked';
    return `<button class="${cls}" data-gsel="${i}" aria-pressed="${sel.includes(i)}" ${G.answered?'disabled':''}><span class="k">${c.labels[i]}</span>${o}</button>`; }).join('')+'</div>'+(G.answered?'':`<div class="actions"><button class="btn primary" data-gact="mcheck" ${sel.length?'':'disabled'}>答え合わせ</button></div>`); }
  return `<div class="choices${c.long?' long':''}">`+c.opts.map((o,i)=>{ let cls='choice'; if(G.answered){ if(i===c.ans) cls+=' ok'; else if(i===c.given) cls+=' ng'; }
    return `<button class="${cls}" data-gopt="${i}" ${G.answered?'disabled':''}>${c.labels&&c.labels[i]===''?'':`<span class="k">${c.labels?c.labels[i]:KANA[i]}</span>`}${c.type==='drill'?esc(o):o}</button>`; }).join('')+'</div>';
}
function judge(ok){ G.total++; if(ok){G.ok++;G.streak++;} else G.streak=0; score(); }

/* ---------- 用語一覧 ---------- */
function renderList(){
  const d=D(); const q=norm(G.listQ);
  const F=d.facts.filter(f=>(G.unit==='all'||f.u===G.unit)&&(G.listDel?DEL.has(f.id):!DEL.has(f.id))&&(!q||norm(f.t+f.k).includes(q)));
  const Es=d.essays.filter(e=>(G.unit==='all'||e.u===G.unit)&&(G.listDel?DEL.has(e.id):!DEL.has(e.id))&&(!q||norm(e.q+e.a).includes(q)));
  let h=`<div class="listbar"><input id="gListQ" class="search" placeholder="語句・文で検索" value="${esc(G.listQ)}"><button class="chip" data-glistdel="0" aria-pressed="${!G.listDel}">出題するもの</button><button class="chip" data-glistdel="1" aria-pressed="${G.listDel}">消したもの（${[...DEL].filter(x=>x.startsWith(G.subj+'-')).length}）</button></div>`;
  if(G.flash){ h+=`<p class="flash">${esc(G.flash)}</p>`; G.flash=''; }
  const byU={}; F.forEach(f=>(byU[f.u]=byU[f.u]||[]).push(f));
  for(const u of d.units){ const L=byU[u.key]; if(!L) continue;
    h+=`<h3 class="gunit">${esc(u.name)}<small>${L.length}語</small></h3><div class="glist">`+L.map(f=>`<div class="gitem"><span class="rkb rkc${f.r}">${f.r}</span><span class="gtxt">${fill(f,'<b>'+esc(f.key)+'</b>')}${f.alts.length>1?`<small>（別解：${f.alts.slice(1).map(esc).join('・')}）</small>`:''}<small class="gcat">${esc(f.c)}</small></span><button class="tbtn" data-g${G.listDel?'revive':'delid'}="${f.id}">${G.listDel?'復活':'消す'}</button></div>`).join('')+'</div>';
  }
  if(Es.length) h+=`<h3 class="gunit">記述問題<small>${Es.length}問</small></h3><div class="glist">`+Es.map(e=>`<div class="gitem"><span class="gtxt"><b>${esc(e.q)}</b><br>${esc(e.a)}<small class="gcat">指定語句：${(e.use||[]).map(esc).join('・')||'なし'}</small></span><button class="tbtn" data-g${G.listDel?'revive':'delid'}="${e.id}">${G.listDel?'復活':'消す'}</button></div>`).join('')+'</div>';
  if(!F.length&&!Es.length) h+='<div class="empty">該当するものはありません。</div>';
  $('#gq').innerHTML=h;
}

/* ---------- プリント ---------- */
function buildSheet(){
  const pr=G.pr; const sh={drill:[],exam:[],essay:[],note:[]};
  const keep=G.recent.slice(); G.recent=[];
  const P=shuffle(facts()); const used=new Set();
  for(const f of P){ if(sh.drill.length>=pr.drill) break; if(used.has(norm(f.key))) continue; used.add(norm(f.key)); sh.drill.push(f); }
  for(let i=0;i<pr.exam;i++){ const q=mkExam('rand'); if(q) sh.exam.push(q); }
  sh.essay=shuffle(essays()).slice(0,pr.essay);
  if(sh.drill.length<pr.drill) sh.note.push('この条件の語句が足りないため、一問一答は少なめです。');
  G.recent=keep; G.sheet=sh;
}
function sheetHTML(){
  const sh=G.sheet, pr=G.pr; let q='', a='', dai=0;
  const n=SUBJ.find(x=>x[0]===G.subj)[1]; const un=G.unit==='all'?'':'・'+D().unitName[G.unit];
  const head=sub=>`<div class="sh-head"><div><div class="sh-title">${esc(pr.title)}${sub?`<span class="sh-sub">${sub}</span>`:''}</div><div class="sh-meta">${esc(n+un)}</div></div><div class="sh-name">組　　番　名前<span class="nm"></span></div></div>`;
  const tool=(k,i)=>`<span class="qtools"><button class="tbtn" data-gre="${k}" data-gi="${i}">この問題を変える</button><button class="tbtn del" data-grm="${k}" data-gi="${i}">消す</button></span>`;
  if(sh.drill.length){ dai++;
    q+=`<section class="dai"><h4><span class="dn">${dai}</span>次の文の空欄にあてはまる語句を書きなさい。</h4><ol class="glq">${sh.drill.map((f,i)=>`<li>${tool('drill',i)}(${i+1}) ${fill(f,'<span class="sblank">　　　　　　</span>')}</li>`).join('')}</ol></section>`;
    a+=`<section class="dai"><h4><span class="dn">${dai}</span>一問一答</h4><ol class="alist">${sh.drill.map((f,i)=>`<li>(${i+1}) <b>${esc(f.key)}</b>${f.alts.length>1?`（${f.alts.slice(1).map(esc).join('・')}）`:''}</li>`).join('')}</ol></section>`; }
  if(sh.exam.length){ dai++;
    q+=`<section class="dai"><h4><span class="dn">${dai}</span>次の問いに答えなさい。</h4>${sh.exam.map((x,i)=>`<div class="sx">${tool('exam',i)}<p>(${i+1}) ${x.stem}</p>${x.box?`<div class="xbox">${x.box}</div>`:''}${x.labels[0]===''?'':`<div class="xopts${x.long?' long':''}">${x.opts.map((o,k)=>`<span><b>${x.labels[k]}</b> ${o}</span>`).join('')}</div>`}</div>`).join('')}</section>`;
    a+=`<section class="dai"><h4><span class="dn">${dai}</span>入試形式</h4><ol class="alist">${sh.exam.map((x,i)=>`<li>(${i+1}) <b>${x.ansText||x.labels[x.ans]||x.opts[x.ans]}</b><span class="ay">${x.expl}</span></li>`).join('')}</ol></section>`; }
  if(sh.essay.length){ dai++;
    q+=`<section class="dai"><h4><span class="dn">${dai}</span>次の問いに答えなさい。</h4>${sh.essay.map((e,i)=>`<div class="sess">${tool('essay',i)}<p>(${i+1}) ${esc(e.q)}<span class="skw">${rule(e,G.hint)}</span></p><div class="lines"></div></div>`).join('')}</section>`;
    a+=`<section class="dai"><h4><span class="dn">${dai}</span>記述（解答例）</h4><ol class="alist">${sh.essay.map((e,i)=>`<li>(${i+1}) ${esc(e.a)}<span class="ay">採点のポイント：${e.kw.map(k=>esc(k[0])).join('・')}</span></li>`).join('')}</ol></section>`; }
  if(!dai) return '<div class="empty">問題がありません。</div>';
  return `<article class="sheet">${head('')}${q}</article>`+(pr.answers?`<article class="sheet ans-sheet">${head('解答')}${a}</article>`:'');
}
function renderPrint(){
  const pr=G.pr, sh=G.sheet;
  const opt=(id,vals,cur,unit)=>`<select class="sel" id="${id}">${vals.map(v=>`<option value="${v}" ${v===cur?'selected':''}>${v}${unit}</option>`).join('')}</select>`;
  $('#gq').innerHTML=`<div class="pset">
    <div class="pset-row"><label for="gTitle">タイトル</label><input class="search" id="gTitle" value="${esc(pr.title)}"></div>
    <div class="pset-row"><label>一問一答</label>${opt('gpDrill',[0,4,6,8,10,12,15,20],pr.drill,'問')}</div>
    <div class="pset-row"><label>入試形式</label>${opt('gpExam',[0,1,2,3,4,5,6,8],pr.exam,'問')}<span class="hint-line">${fmtsFor().map(k=>FMTS[k][0]).join('・')}</span></div>
    <div class="pset-row"><label>記述</label>${opt('gpEssay',[0,1,2,3,4],pr.essay,'問')}<span class="hint-line">指定語句：</span><button class="chip" data-ghint="1" aria-pressed="${G.hint}">つける</button><button class="chip" data-ghint="0" aria-pressed="${!G.hint}">つけない</button></div>
    <div class="pset-row"><label>解答</label><button class="chip" data-gans aria-pressed="${pr.answers}">解答ページをつける</button></div>
    <div class="pset-row"><label>用紙</label><span id="gPg" class="pginfo"></span><button class="btn sm" data-gact="fit" id="gFit" hidden>1枚に収める</button></div>
    <div class="actions"><button class="btn" data-gact="rebuild">問題を作り直す</button><button class="btn primary" data-gact="print">印刷する</button></div>
    ${sh.note.length?`<p class="warn">${sh.note.map(esc).join('<br>')}</p>`:''}</div><div id="gsheets">${sheetHTML()}</div>`;
  showPg();
}
function pages(){
  const art=document.querySelector('#gsheets article.sheet:not(.ans-sheet)'); if(!art) return 0;
  const box=document.createElement('div'); box.className='measure'; box.innerHTML='<div class="mm"></div>'+art.outerHTML; document.body.appendChild(box);
  const mm=box.querySelector('.mm').getBoundingClientRect().width/100; const h=box.querySelector('article').getBoundingClientRect().height; box.remove();
  return h/(270*mm);
}
function showPg(){ const el=$('#gPg'); if(!el) return; const n=pages(); el.textContent=n<=1?'問題用紙は1枚に収まっています':`問題用紙は約${n.toFixed(1)}枚分（${Math.ceil(n)}枚になります）`; el.classList.toggle('over',n>1); $('#gFit').hidden=n<=1; }
function fitPage(){
  const sh=G.sheet;
  for(let t=0;t<40;t++){ renderPrint(); if(pages()<=1) break;
    if(sh.exam.length>1) sh.exam.pop(); else if(sh.drill.length>4) sh.drill.pop(); else if(sh.essay.length) sh.essay.pop(); else if(sh.exam.length) sh.exam.pop(); else if(sh.drill.length>1) sh.drill.pop(); else break; }
  G.pr.drill=sh.drill.length; G.pr.exam=sh.exam.length; G.pr.essay=sh.essay.length; renderPrint();
}

/* ---------- 操作 ---------- */
document.addEventListener('click',ev=>{
  const b=ev.target.closest('button'); if(!b) return;
  if(b.dataset.gsubj){ setSubj(b.dataset.gsubj); return; }
  if(document.body.dataset.subj==='rk') return;
  const d=b.dataset;
  if(d.gmode){ G.mode=d.gmode; ls.set('g-mode',G.mode); renderG(); newG(); return; }
  if(d.grank){ const r=d.grank; G.ranks=G.ranks.includes(r)?G.ranks.filter(x=>x!==r):[...G.ranks,r]; if(!G.ranks.length) G.ranks=[r]; G.sheet=null; renderG(); newG(); return; }
  if(d.gwrite){ G.write=d.gwrite==='1'; renderG(); newG(); return; }
  if(d.gfmt){ G.fmt=d.gfmt; renderG(); newG(); return; }
  if(d.ghint){ G.hint=d.ghint==='1'; if(G.mode==='print') renderPrint(); else { renderG(); renderQ(); } return; }
  if(d.gans!==undefined){ G.pr.answers=!G.pr.answers; renderPrint(); return; }
  if(d.glistdel){ G.listDel=d.glistdel==='1'; renderList(); return; }
  if(d.gdelid){ DEL.add(d.gdelid); saveDel(); G.flash='消しました。「消したもの」からいつでも復活できます。'; const y=window.scrollY; renderList(); window.scrollTo({top:y}); return; }
  if(d.grevive){ DEL.delete(d.grevive); saveDel(); G.flash='復活しました。'; const y=window.scrollY; renderList(); window.scrollTo({top:y}); return; }
  if(d.gsel!==undefined&&G.cur&&!G.answered){ const c=G.cur; c.sel=c.sel||[]; const i=+d.gsel; c.sel=c.sel.includes(i)?c.sel.filter(x=>x!==i):[...c.sel,i]; renderQ(); return; }
  if(d.gopt!==undefined&&G.cur&&!G.answered){ const c=G.cur; c.given=+d.gopt; G.answered=true; judge(c.given===c.ans); renderQ(); return; }
  if(d.gre||d.grm){ const k=d.gre||d.grm, i=+d.gi, sh=G.sheet;
    if(d.grm) sh[k].splice(i,1);
    else if(k==='drill'){ const have=new Set(sh.drill.map(f=>norm(f.key))); const c=shuffle(facts()).find(f=>!have.has(norm(f.key))); if(c) sh.drill[i]=c; }
    else if(k==='exam'){ const q=mkExam('rand'); if(q) sh.exam[i]=q; }
    else { const have=new Set(sh.essay.map(e=>e.id)); const c=shuffle(essays()).find(e=>!have.has(e.id)); if(c) sh.essay[i]=c; }
    G.pr.drill=sh.drill.length; G.pr.exam=sh.exam.length; G.pr.essay=sh.essay.length; const y=window.scrollY; renderPrint(); window.scrollTo({top:y}); return; }
  if(d.gact==='mcheck'&&G.cur&&!G.answered){ const c=G.cur; const a1=(c.sel||[]).slice().sort().join(), a2=c.ansSet.slice().sort().join(); c.okw=a1===a2; c.given=-2; G.answered=true; judge(c.okw); renderQ(); return; }
  switch(d.gact){
    case 'next': newG(); break;
    case 'esshow': { const t=$('#gEs'); G.cur.text=t?t.value:''; G.answered=true; judge(true); renderQ(); break; }
    case 'del': { const c=G.cur; const id=c.f?c.f.id:null; if(id){ DEL.add(id); saveDel(); } newG(); break; }
    case 'rebuild': { let best=null,bp=99; for(let t=0;t<6;t++){ buildSheet(); renderPrint(); const n=pages(); if(n<bp){bp=n;best=G.sheet;} if(n<=1) break; } G.sheet=best; renderPrint(); break; }
    case 'fit': fitPage(); break;
    case 'print': window.print(); break;
  }
});
document.addEventListener('change',ev=>{
  if(document.body.dataset.subj==='rk') return;
  const id=ev.target.id, v=ev.target.value;
  if(id==='gUnit'){ G.unit=v; G.sheet=null; G.fitted=false; newG(); }
  if(id==='gpDrill'){ G.pr.drill=+v; buildSheet(); renderPrint(); }
  if(id==='gpExam'){ G.pr.exam=+v; buildSheet(); renderPrint(); }
  if(id==='gpEssay'){ G.pr.essay=+v; buildSheet(); renderPrint(); }
});
document.addEventListener('input',ev=>{
  if(document.body.dataset.subj==='rk') return;
  if(ev.target.id==='gListQ'){ G.listQ=ev.target.value; const p=ev.target.selectionStart; renderList(); const i=$('#gListQ'); i.focus(); i.setSelectionRange(p,p); }
  if(ev.target.id==='gTitle'){ G.pr.title=ev.target.value; document.querySelectorAll('#gsheets .sh-title').forEach(t=>{const sub=t.querySelector('.sh-sub'); t.textContent=G.pr.title; if(sub) t.appendChild(sub);}); }
});
document.addEventListener('submit',ev=>{
  if(ev.target.id!=='gForm') return; ev.preventDefault(); const c=G.cur; if(!c||G.answered) return;
  const v=$('#gIn').value.trim(); if(!v) return; c.okw=c.f.alts.some(a=>norm(a)===norm(v)); c.given=c.okw?c.ans:-1; G.answered=true; judge(c.okw); renderQ();
});
document.addEventListener('keydown',ev=>{
  if(document.body.dataset.subj==='rk'||ev.key!=='Enter'||ev.isComposing) return;
  const tag=(ev.target.tagName||'').toLowerCase(); if(['textarea','button','input','select'].includes(tag)) return;
  if(G.answered){ const n=$('[data-gact="next"]'); if(n){ev.preventDefault(); newG();} }
});

// 起動
const hdr=document.querySelector('header'); hdr.insertAdjacentHTML('afterend',subjBar()+'<section class="panel gpanel" id="gpanel" aria-label="出題設定"></section><main id="gq" class="q gq" aria-live="polite"></main>');
document.body.dataset.subj='rk';
if(G.subj!=='rk') setSubj(G.subj);
})();
</script>
